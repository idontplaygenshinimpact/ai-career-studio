              - text: 文瑞翔 前端工程师 ｜ 男 · 21岁 · 本科在读 ｜ 19213287749 ｜ 920232776@qq.com 211 计算机本科 AI 数据公司实习 Vue3 / React / TypeScript SSE / 工程化 / 数据可视化 个人总结 合肥工业大学计算机科学与技术专业大三在读，具备 Vue3 / React / TypeScript 前端开发经验，熟悉中后台权限路由、状态管理、SSE 流式响应、数据可视化与工程化配置。目前在 AI 数据公司实习，参与 img2code 数据生产链路及标注工具相关开发，关注 AI 应用前端、数据平台与工程效率提升。 实习经历 杭州曼孚科技有限公司（MindFlow）｜前端开发实习生 20XX.XX - 至今 • 参与 img2code 数据生产项目，理解网页采集、静态渲染截图、代码清洗、样本质检到训练数据输出的完整流程 • 参与数据标注与质检工具前端模块开发，围绕样本预览、代码比对、状态流转、异常标记完成交互与接口联调 • 编写数据清洗、格式转换与质量校验脚本，处理字段缺失、资源路径异常、样本格式不一致等问题，降低人工检查成本 • 参与前端工具链维护与工程化脚本编写，关注重复流程自动化、异常样本快速定位和数据处理链路稳定性 • 沉淀常见异常处理规则，提升样本处理流程的可复用性和问题排查效率 • 高频使用 Claude / GPT / OpenCode 辅助调研、问题定位与重构，并对业务逻辑和代码变更进行人工校验 专业技能 前端基础：TypeScript / JavaScript、ES6+、Promise、事件循环、闭包、原型链 Vue / React：Vue3 Composition API、Vue Router、Pinia；React Hooks、Redux Toolkit、React Router 工程化：Vite、TS strict、ESLint flat config、Prettier、路径别名、自动导入、按需加载 网络鉴权：Axios 拦截器、JWT、Token 持久化、路由守卫、SSE 流式响应 样式可视化：Flex / Grid、SCSS / Less、Element Plus、ECharts 动态图表 AI / 协作：Claude / GPT / OpenCode 辅助开发、Git 分支管理、commit 规范 项目经历 AgentChat 智能对话平台｜Vue 3.4 + TypeScript + Vite + Pinia + Element Plus 个人 Demo · 前端独立开发 • 项目规模：31 个 Vue 组件、15 个 API 服务模块、4 个 Pinia Store、20+ 页面路由；后端涉及 FastAPI、LangChain、MySQL、Redis、ChromaDB • SSE 流式对话：基于 @microsoft/fetch-event-source 实现流式响应，通过会话维度维护消息追加状态，支持多会话切换下的实时输出展示 • 状态管理与鉴权：使用 Pinia 拆分认证、会话、历史消息、Agent 配置等模块，结合持久化插件和路由守卫实现登录态与页面级权限控制 • Markdown / 看板：集成 Markdown 渲染、代码高亮、配置编辑与实时预览；基于 ECharts 支持按 Agent、模型、时间范围筛选调用次数与 Token 消耗 • 接口封装：按业务域拆分 API 服务模块，统一处理请求参数、响应结构和错误状态，降低页面组件与后端接口的耦合 • 工程化：使用 auto-import 与 components 插件实现 Vue / Element Plus API 和组件自动导入，减少重复 import 并提升维护效率 • 模块组织：按 API 服务层、状态层、页面层和通用组件层拆分目录结构，降低对话、Agent 配置、统计看板等模块之间的耦合 仿网易云音乐｜React 18 + TypeScript + Vite + Redux Toolkit + Less 独立开发 • 状态架构：使用 Redux Toolkit 管理当前曲目、播放列表、播放状态、进度、模式和音量，并封装类型化 Hooks 提升类型安全 • 播放控制：基于 HTML5 Audio API 封装播放/暂停、上下曲、进度拖拽、音量调节，通过事件监听同步 UI 状态 • 体验优化：结合 React Router Outlet 使底部播放栏常驻，避免路由切换导致播放中断；使用 React.lazy + Suspense 进行代码分割 • 播放模式：支持顺序、随机、单曲循环；随机播放使用 Fisher-Yates 洗牌算法生成随机播放序列，保证随机且覆盖完整列表 仿东方甄选电商平台｜Vue3 + TypeScript + Vite + Pinia + Sass 独立开发 · 可替换项目 • 业务页面：完成首页、商品列表、商品详情、购物车等页面开发，基于 Flex / Grid 和 Sass 变量体系适配桌面端和平板端展示 • 组件抽象：实现路由懒加载、Pinia 状态管理、商品卡片、筛选栏、主题切换等组件/组合式函数封装，减少重复逻辑 教育背景 合肥工业大学（211）｜计算机科学与技术 · 本科 2023.09 - 2027.06
